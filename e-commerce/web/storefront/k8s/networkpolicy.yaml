# Callers: only the edge (pages) and Keycloak (back-channel logout, from the platform namespace). Egress: the gateway,
# and Keycloak and redis-session in the platform namespace; object storage for staff image uploads goes through the
# egress gateway in production (as catalog-service's does).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storefront
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: edge } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [ { port: 8090 } ]
  egress:
    - to: [ { podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } } } ]
      ports: [ { port: 8080 } ]
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-gateway } } } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
