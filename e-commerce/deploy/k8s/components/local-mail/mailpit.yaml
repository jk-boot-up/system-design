apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: e-commerce-platform
  labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: e-commerce }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mailpit } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: e-commerce }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports: [ { name: smtp, containerPort: 1025 }, { name: http, containerPort: 8025 } ]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: e-commerce-platform
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports: [ { name: smtp, port: 1025, targetPort: smtp }, { name: http, port: 8025, targetPort: http } ]
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: e-commerce-shop
spec: { type: ExternalName, externalName: mailpit.e-commerce-platform.svc.cluster.local }
