apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: e-commerce-platform
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: e-commerce }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: e-commerce }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          envFrom: [ { secretRef: { name: object-storage } } ]
          ports: [ { name: s3, containerPort: 9000 } ]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: e-commerce-platform
spec:
  selector: { app.kubernetes.io/name: minio }
  ports: [ { name: s3, port: 9000, targetPort: s3 } ]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: e-commerce-shop
spec: { type: ExternalName, externalName: minio.e-commerce-platform.svc.cluster.local }
