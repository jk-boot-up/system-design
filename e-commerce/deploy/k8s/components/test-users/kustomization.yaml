# Dev only: the local stack's test users (ada and bob, customers; sam, staff) and the password grant the end-to-end tests
# and smoke test use to get tokens.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: KeycloakRealmImport, name: shop }
    path: users.yaml
# The test users have no second factor, so dev lets staff pages open with a password sign-in (staging and prod do not).
configMapGenerator:
  - { name: storefront, namespace: e-commerce-shop, behavior: merge, literals: [ STAFF_REQUIRE_SECOND_FACTOR=false ] }
