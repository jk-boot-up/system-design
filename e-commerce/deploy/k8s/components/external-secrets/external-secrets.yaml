# Secrets from the cluster's secret manager through External Secrets Operator. The ClusterSecretStore "e-commerce" is
# set up once per cluster (README) and points at that environment's vault, so the same keys hold different values per
# environment. Values that must agree are read from one key: catalog's DB user from catalog-db, notification's AMQP URL
# from notification-rabbitmq.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: orders-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/orders-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-db
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: inventory-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/inventory-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-db
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: payments-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/payments-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: catalog-db
