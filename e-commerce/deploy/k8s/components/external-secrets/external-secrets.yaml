  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: keycloak-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/keycloak-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: orders-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/orders-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-db
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: inventory-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/inventory-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-db
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: payments-db
    template: { type: kubernetes.io/basic-auth }
  dataFrom: [ { extract: { key: e-commerce/payments-db } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-rabbitmq
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target: { name: notification-rabbitmq }
  dataFrom: [ { extract: { key: e-commerce/notification-rabbitmq } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-service
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: catalog-service
    template:
      data:
        DB_USER: "{{ .db_username }}"
        DB_PASSWORD: "{{ .db_password }}"
        S3_ACCESS_KEY: "{{ .s3_access_key }}"
        S3_SECRET_KEY: "{{ .s3_secret_key }}"
  data:
    - { secretKey: db_username, remoteRef: { key: e-commerce/catalog-db, property: username } }
    - { secretKey: db_password, remoteRef: { key: e-commerce/catalog-db, property: password } }
    - { secretKey: s3_access_key, remoteRef: { key: e-commerce/object-storage, property: access_key } }
    - { secretKey: s3_secret_key, remoteRef: { key: e-commerce/object-storage, property: secret_key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-service
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: notification-service
    template:
      data:
        RABBITMQ_URL: "amqp://{{ .username | urlquery }}:{{ .password | urlquery }}@rabbitmq:5672/"
  dataFrom: [ { extract: { key: e-commerce/notification-rabbitmq } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: analytics
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: analytics
    template:
      data:
        CLICKHOUSE_PASSWORD: "{{ .default_password }}"
        CLICKHOUSE_GRAFANA_PASSWORD: "{{ .grafana_password }}"
  dataFrom: [ { extract: { key: e-commerce/analytics } } ]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront-oidc
  namespace: e-commerce-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target: { name: storefront-oidc }
  data:
    - { secretKey: client-secret, remoteRef: { key: e-commerce/storefront, property: client_secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront
  namespace: e-commerce-shop
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: e-commerce }
  target:
    name: storefront
    template:
      data:
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
        SESSION_ENCRYPTION_KEYS: "{{ .session_keys }}"
  data:
    - { secretKey: client_secret, remoteRef: { key: e-commerce/storefront, property: client_secret } }
    - { secretKey: session_keys, remoteRef: { key: e-commerce/storefront, property: session_keys } }
