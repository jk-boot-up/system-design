# Topics from design/10-event-catalogue.md (the same list deploy/compose/kafka/create-topics.sh creates locally), managed by
# Strimzi's topic operator. Replication factor 3 everywhere; min.insync.replicas 2 comes from the broker defaults.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog-events
  labels: { strimzi.io/cluster: kafka }
spec:
  topicName: catalog.events
  partitions: 12
  replicas: 3
  config: { retention.ms: 604800000 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog-events-dlq
  labels: { strimzi.io/cluster: kafka }
spec:
