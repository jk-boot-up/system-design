# Kafka 4.3 through Strimzi, in KRaft mode: three nodes that are both controllers and brokers, one per zone. Topics are
# never auto-created (topics.yaml declares them), and every write waits for two in-sync replicas.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels: { strimzi.io/cluster: kafka }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 200Gi, deleteClaim: false, kraftMetadata: shared }
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { strimzi.io/pool-name: combined } }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    version: 4.3.2
    rack: { topologyKey: topology.kubernetes.io/zone }
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      auto.create.topics.enable: false
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
  entityOperator:
    topicOperator: {}
