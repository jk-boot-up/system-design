# Keycloak 26.8 through the Keycloak operator (installed in this namespace; it watches only its own). Two instances on
# keycloak-db. Browsers reach it at the public host name through the operator's Ingress; services fetch signing keys over
# plain HTTP inside the cluster (the keycloak alias in e-commerce-shop), and tokens always carry the public issuer.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 2
  image: keycloak/keycloak:26.8.2
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret: { name: keycloak-db, key: username }
    passwordSecret: { name: keycloak-db, key: password }
  http:
    httpEnabled: true
    tlsSecret: keycloak-tls
  hostname:
    hostname: https://id.shop.example
    backchannelDynamic: true
  proxy: { headers: xforwarded }
  ingress:
    enabled: true
    tlsSecret: keycloak-tls
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 1500Mi }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
spec:
  secretName: keycloak-tls
  dnsNames: [ id.shop.example ]
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
---
# The shop realm: roles, the storefront's confidential client, the public API client with PKCE, the shop-api audience and a "roles" claim,
# and one client-credentials client per service that calls another's /internal API (its token's audience names the callees), as in
# deploy/compose/keycloak/shop-realm.json, without its test users (the dev overlay adds them).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: shop
spec:
  keycloakCRName: keycloak
  # Client secrets are never written here: the operator substitutes them from the Secrets.
  placeholders:
    STOREFRONT_CLIENT_SECRET: { secret: { name: storefront-oidc, key: client-secret } }
    ORDER_SERVICE_CLIENT_SECRET: { secret: { name: order-service-oidc, key: client-secret } }
    CART_SERVICE_CLIENT_SECRET: { secret: { name: cart-service-oidc, key: client-secret } }
  realm:
    realm: shop
    enabled: true
    sslRequired: external
    accessTokenLifespan: 300          # SPEC §8.1: 5 minutes for user tokens (the local compose realm uses 15 for load tests)
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 43200
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    bruteForceProtected: true
    failureFactor: 10
    passwordPolicy: "length(12) and notUsername and passwordHistory(3)"
    registrationAllowed: true
    loginWithEmailAllowed: true
    roles:
      realm:
        - { name: customer, description: Shopper }
        - { name: staff, description: "Merchandiser: catalogue and stock" }
    defaultRoles: [customer]
    clients:
      # Browsers sign in through the storefront (design/16 §16.5): a confidential client, tokens kept on the server.
      - clientId: shop-storefront
        name: Storefront (backend-for-frontend)
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${STOREFRONT_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        frontchannelLogout: false
        redirectUris: [ "https://shop.example/auth/callback" ]
        webOrigins: [ "+" ]
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://shop.example/"
          backchannel.logout.url: http://storefront.e-commerce-shop.svc.cluster.local/auth/backchannel-logout
          backchannel.logout.session.required: "true"
          use.refresh.tokens: "true"
        protocolMappers:
          - name: audience shop-api
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config: { included.custom.audience: shop-api, access.token.claim: "true", id.token.claim: "false" }
          - name: roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              multivalued: "true"
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
          - name: amr
            protocol: openid-connect
            protocolMapper: oidc-amr-mapper
            config: { access.token.claim: "true", id.token.claim: "true", introspection.token.claim: "true" }
      # Service identities (12-security-design §12.4): client credentials only, no users, no realm roles in the token; the
      # audience lists exactly the services this one may call, and each callee also checks the caller (azp).
      - clientId: order-service
        name: order-service
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ORDER_SERVICE_CLIENT_SECRET}
        attributes: { access.token.lifespan: "900" }    # 15 minutes; renewed after 10, so Keycloak may be down ~5 minutes
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: true
        fullScopeAllowed: false
        protocolMappers:
          - { name: audience cart-service, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
              config: { included.custom.audience: cart-service, access.token.claim: "true", id.token.claim: "false" } }
          - { name: audience inventory-service, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
              config: { included.custom.audience: inventory-service, access.token.claim: "true", id.token.claim: "false" } }
          - { name: audience payment-service, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
              config: { included.custom.audience: payment-service, access.token.claim: "true", id.token.claim: "false" } }
      - clientId: cart-service
        name: cart-service
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${CART_SERVICE_CLIENT_SECRET}
        attributes: { access.token.lifespan: "900" }    # 15 minutes; renewed after 10, so Keycloak may be down ~5 minutes
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: true
        fullScopeAllowed: false
        protocolMappers:
          - { name: audience catalog-service, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
              config: { included.custom.audience: catalog-service, access.token.claim: "true", id.token.claim: "false" } }
      # Public client for bearer-token API clients (tools, the end-to-end tests in dev); not used by browsers.
      - clientId: shop-web
        name: Shop web app
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: [ "https://shop.example/*" ]
        webOrigins: [ "https://shop.example" ]
        attributes: { pkce.code.challenge.method: S256 }
        protocolMappers:
          - name: audience shop-api
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config: { included.custom.audience: shop-api, access.token.claim: "true", id.token.claim: "false" }
          - name: roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              multivalued: "true"
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
