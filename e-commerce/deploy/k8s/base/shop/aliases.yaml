kind: Service
metadata: { name: pgbouncer-orders }
spec: { type: ExternalName, externalName: pgbouncer-orders.e-commerce-platform.svc.cluster.local }
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer-payments }
spec: { type: ExternalName, externalName: pgbouncer-payments.e-commerce-platform.svc.cluster.local }
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer-catalog }
spec: { type: ExternalName, externalName: pgbouncer-catalog.e-commerce-platform.svc.cluster.local }
---
apiVersion: v1
kind: Service
metadata: { name: redis-cache }
spec: { type: ExternalName, externalName: redis-cache.e-commerce-platform.svc.cluster.local }
