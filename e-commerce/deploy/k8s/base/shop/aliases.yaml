# The service bases use short names (kafka-bootstrap, pgbouncer-orders, redis-cart, ...) so they read the same locally and
# here. The stores live in e-commerce-platform; these aliases point each short name at the Service its operator creates.
# Network policies match the pods behind them, so the aliases grant no access of their own.
apiVersion: v1
kind: Service
metadata: { name: kafka-bootstrap }
spec: { type: ExternalName, externalName: kafka-kafka-bootstrap.e-commerce-platform.svc.cluster.local }
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer-inventory }
spec: { type: ExternalName, externalName: pgbouncer-inventory.e-commerce-platform.svc.cluster.local }
---
