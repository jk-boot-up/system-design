apiVersion: 1
# Traces, logs and metrics are linked: a log line's trace_id opens the trace in Tempo; a span opens its service's logs
# around that time in Loki; a latency panel's exemplars open the traces behind them.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations: [ { name: trace_id, datasourceUid: tempo } ]
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        tags: [ { key: service.name, value: service } ]
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph: { enabled: true }
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: $${__value.raw}
          urlDisplayLabel: Open trace
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData: { host: analytics, port: 9000, protocol: native, defaultDatabase: analytics, username: grafana }
    secureJsonData: { password: grafana }
