global:
  scrape_interval: 15s
  evaluation_interval: 30s
# SLO recording rules, burn-rate alerts and platform alerts (deploy/observability/prometheus/rules; see generate.py there).
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    honor_labels: true      # the gateway already labels its series service="api-gateway"
    static_configs:
      - targets: [api-gateway:8080, catalog-service:8081, search-service:8082, cart-service:8083, inventory-service:8084,
                  order-service:8085, payment-service:9086, review-service:8087]   # payment: management port
    relabel_configs: &service-from-host
      - { source_labels: [__address__], regex: "([^:]+):.*", target_label: service }
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: [notification-service:8088, recommendation-service:8089]
    relabel_configs: *service-from-host
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: clickhouse
    static_configs:
      - targets: [analytics:9363]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
