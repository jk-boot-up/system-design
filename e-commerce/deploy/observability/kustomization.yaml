# Observability objects for the shop's Kubernetes overlays (included by deploy/k8s/base). The stack itself (Prometheus
# Operator, Grafana, Alertmanager, Tempo, Loki, Alloy) is installed once per cluster from Helm charts with the values in
# k8s/values/ (see README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/podmonitors.yaml
  - k8s/prometheusrule.yaml
  - k8s/networkpolicy.yaml
# Grafana's dashboard sidecar loads ConfigMaps labelled grafana_dashboard from every namespace (values/kube-prometheus-stack.yaml).
configMapGenerator:
  - name: e-commerce-dashboards
    namespace: e-commerce-platform
    files: [grafana/dashboards/ecommerce-red.json, grafana/dashboards/ecommerce-slo.json, grafana/dashboards/ecommerce-events.json]
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }
      annotations: { grafana_folder: E-commerce }
