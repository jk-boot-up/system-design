# What Prometheus (kube-prometheus-stack, namespace monitoring) scrapes. The "service" label matches the compose stack's,
# so the rules and dashboards work in both.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: java-services
  namespace: e-commerce-shop
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api-gateway, catalog-service, search-service, cart-service, inventory-service, order-service, payment-service, review-service]
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      relabelings: &service
        - { sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], targetLabel: service }
        - { targetLabel: job, replacement: spring }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: other-services
  namespace: e-commerce-shop
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [notification-service, recommendation-service, storefront] }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], targetLabel: service }
        - { targetLabel: job, replacement: services }
---
# Strimzi's Kafka exporter (spec.kafkaExporter of the Kafka resource): consumer lag and topic offsets.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: e-commerce-platform
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { strimzi.io/kind: Kafka, strimzi.io/name: kafka-kafka-exporter }
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 30s
      relabelings:
        - { targetLabel: job, replacement: kafka }
