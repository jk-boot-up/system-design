# helm upgrade --install alloy grafana/alloy --version 1.15.0 -n monitoring -f deploy/observability/k8s/values/alloy.yaml
# Alloy as a DaemonSet: the OTLP endpoint of the services (Service alloy.monitoring:4317/4318) and the reader of pod logs.
# Tail sampling needs every span of a trace in one place, so spans are routed by trace id to the alloy-sampler
# StatefulSet (alloy-sampler.yaml), which decides what to keep.
controller: { type: daemonset }
alloy:
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
  mounts: { varlog: true }
  extraEnv: [ { name: K8S_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } } ]   # only this node's pods
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 1Gi } }
  configMap:
    content: |
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output { traces = [otelcol.exporter.loadbalancing.sampler.input] }
      }

      // Same trace id, same sampler pod: the sampler sees whole traces.
      otelcol.exporter.loadbalancing "sampler" {
        routing_key = "traceID"
        resolver {
          kubernetes {
            service = "alloy-sampler.monitoring"
            ports   = [4317]
          }
        }
        protocol {
          otlp {
            client { tls { insecure = true } }
          }
        }
      }

      // Pod logs of the shop and platform namespaces, from this node's log files.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces { names = ["e-commerce-shop", "e-commerce-platform"] }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.structured.receiver]
      }

      loki.process "structured" {
        stage.cri {}
        stage.json {
          expressions = { level = "log.level || level", trace_id = "traceId || trace_id" }
        }
        stage.labels {
          values = { level = "" }
        }
        stage.structured_metadata {
          values = { trace_id = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint { url = "http://loki-gateway.monitoring/loki/api/v1/push" }
      }
