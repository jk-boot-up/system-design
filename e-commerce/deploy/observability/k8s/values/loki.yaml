# helm upgrade --install loki grafana/loki -n monitoring -f deploy/observability/k8s/values/loki.yaml
# Simple scalable Loki with chunks in object storage; trace_id is structured metadata, not a label.
deploymentMode: SimpleScalable
loki:
  image: { tag: 3.7.9 }
  auth_enabled: false
  schemaConfig:
    configs: [ { from: "2026-01-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: index_, period: 24h } } ]
  storage:
    type: s3
    bucketNames: { chunks: e-commerce-logs-chunks, ruler: e-commerce-logs-ruler, admin: e-commerce-logs-admin }
    s3: { region: eu-central-1 }
  limits_config:
    retention_period: 720h          # 30 days; personal data never reaches the logs (the storefront and services redact it)
    allow_structured_metadata: true
  compactor: { retention_enabled: true, delete_request_store: s3 }
