  - name: "slo-alerts"
    rules:
      - alert: "ErrorBudgetBurnFast"
        expr: |-
          (slo:error_ratio:rate1h{slo="browse-availability"} > (14.4 * 0.0005) and slo:error_ratio:rate5m{slo="browse-availability"} > (14.4 * 0.0005))
           or (slo:error_ratio:rate6h{slo="browse-availability"} > (6 * 0.0005) and slo:error_ratio:rate30m{slo="browse-availability"} > (6 * 0.0005))
        labels:
          severity: "page"
          slo: "browse-availability"
        annotations:
          summary: "browse-availability is burning its error budget fast"
          description: "browse-availability: more than 0.0500% of requests failing (objective 99.95% over 30 days). Check the SLO dashboard, then the service's RED dashboard and the traces of failing requests."
          runbook_url: "https://github.com/jk-boot-up/system-design/blob/main/e-commerce/deploy/observability/RUNBOOK.md#error-budget-burn"
      - alert: "ErrorBudgetBurnSlow"
        expr: |-
          (slo:error_ratio:rate1d{slo="browse-availability"} > (3 * 0.0005) and slo:error_ratio:rate2h{slo="browse-availability"} > (3 * 0.0005))
           or (slo:error_ratio:rate3d{slo="browse-availability"} > (1 * 0.0005) and slo:error_ratio:rate6h{slo="browse-availability"} > (1 * 0.0005))
