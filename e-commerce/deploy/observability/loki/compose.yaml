# Loki, single binary, logs kept for 3 days on local disk (deploy/compose, profile "observability").
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage:
    filesystem: { chunks_directory: /tmp/loki/chunks, rules_directory: /tmp/loki/rules }
schema_config:
  configs:
    - { from: "2026-01-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
limits_config:
  retention_period: 72h
  allow_structured_metadata: true
  volume_enabled: true
compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
query_range:
  results_cache:
    cache: { embedded_cache: { enabled: true, max_size_mb: 32 } }
analytics:
  reporting_enabled: false
