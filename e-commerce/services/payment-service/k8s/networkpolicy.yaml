# Only order-service may call payment-service (and must present its own token, ADR 0014). Health and metrics are on the
# management port 9086, which only Prometheus in "monitoring" reaches (deploy/observability/k8s/networkpolicy.yaml);
# probes come from the kubelet. Egress: its database, Kafka, and the payment provider (FQDN allow-list at the egress gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
      ports: [ { port: 8086 } ]
  egress:
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-gateway } } } ]
      ports: [ { port: 443 } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
