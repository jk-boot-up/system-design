apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/part-of: e-commerce
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: payment-service
    literals:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.monitoring:4318/v1/traces
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
      - DB_URL=jdbc:postgresql://pgbouncer-payments:5432/payments
      - KAFKA_BOOTSTRAP=kafka-bootstrap:9092
      - JWT_ISSUER=https://id.shop.example/realms/shop
      - DB_POOL_SIZE=20
      - MANAGEMENT_PORT=9086      # health and metrics on their own port, outside the API's network policy
