# The shop's own ModSecurity rules, loaded before the OWASP Core Rule Set (as a CRS plugin file, *-before.conf). Keep
# this short: every exclusion widens what the firewall lets through, so each one names the request it is for and why it
# is safe. A false positive shows in the edge's log as a ModSecurity audit record with the rule id; exclude that rule for
# that path and argument only.

# Health checks from the load balancer and Kubernetes: no inspection, no audit log.
SecRule REQUEST_URI "@streq /healthz" "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"

# The sign-in callback: Keycloak returns its issuer URL in "iss" (RFC 9207, mix-up protection), which the remote file
# inclusion and SSRF rules read as an off-site URL. The storefront compares it with the configured issuer exactly.
SecRule REQUEST_FILENAME "@streq /auth/callback" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=931130;ARGS:iss,ctl:ruleRemoveTargetById=934110;ARGS:iss"

# Staff product forms and the staff product API behind them: names, brands and descriptions are free text and may
# contain words the rule set treats as database names ("Northwind", "master"). Only rule 942140 is off, only on these
# staff-only paths (the gateway and catalog require the staff role); catalog-service stores the text through
# parameterised queries.
SecRule REQUEST_FILENAME "@rx ^/(staff/products|api/v1/admin/products)(/|$)" \
    "id:1002,phase:1,pass,nolog,ctl:ruleRemoveById=942140"
