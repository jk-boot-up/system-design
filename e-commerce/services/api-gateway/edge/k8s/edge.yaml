# NGINX edge: the only workload with a public address. The TLS certificate comes from cert-manager (secret edge-tls).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels: { app.kubernetes.io/name: edge, app.kubernetes.io/part-of: e-commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: edge } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: edge, app.kubernetes.io/part-of: e-commerce }
    spec:
      containers:
        - name: nginx
          image: e-commerce/edge:0.1.0
          env: [ { name: GATEWAY_UPSTREAM, value: "api-gateway:80" } ]
          ports: [ { name: http, containerPort: 8080 }, { name: https, containerPort: 8443 } ]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          lifecycle: { preStop: { sleep: { seconds: 10 } } }
          volumeMounts:
            - { name: tls, mountPath: /etc/nginx/certs, readOnly: true }
            - { name: docs, mountPath: /usr/share/nginx/docs, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tls, secret: { secretName: edge-tls } }
        - { name: docs, configMap: { name: system-docs, optional: true } }
        - { name: cache, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: edge }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
---
# The edge accepts traffic from anywhere and may only reach the gateway (and DNS, for re-resolving its address).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: edge } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [ { port: 8080 }, { port: 8443 } ]
  egress:
    - to: [ { podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } } } ]
      ports: [ { port: 8080 } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
