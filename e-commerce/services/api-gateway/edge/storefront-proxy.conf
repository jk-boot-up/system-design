# Proxying to the storefront. It sets its own security headers (CSP with a per-page nonce, frame and permission
# policies); the edge replaces the ones it also sets so each appears once, with the edge's value.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Request-Id;
proxy_set_header Host $http_host;   # with the port, so the page origin matches the browser's Origin
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $req_id;
proxy_set_header Accept-Encoding "";   # the edge compresses; cached pages are stored once, uncompressed
include /etc/nginx/security-headers.conf;
proxy_pass http://storefront;
