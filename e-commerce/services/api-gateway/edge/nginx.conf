# NGINX edge in front of the storefront and the api-gateway: TLS and HTTP/2, compression, a first coarse per-address limit,
# micro-caching of anonymous catalogue and search reads, the static documentation, and a request id for every request.
# Every request passes the web application firewall first (ModSecurity with the OWASP Core Rule Set, conf.d/modsecurity.conf
# from the base image; the shop's own rules in waf/). Requests whose anomaly score reaches 5 are refused with 403.
load_module modules/ngx_http_modsecurity_module.so;
# Every request starts (or continues) a trace here and passes its traceparent on to the storefront or the gateway, so
# a trace begins where the customer's request enters. Spans go to the collector in OTEL_COLLECTOR (OTLP over gRPC).
load_module modules/ngx_otel_module.so;
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;          # raised to 6m for staff pages only (product images)

    log_format json escape=json '{"time":"$time_iso8601","requestId":"$req_id","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                                '"upstreamRt":"$upstream_response_time","cache":"$upstream_cache_status"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Keep a well-formed incoming id (the gateway checks it again); otherwise use NGINX's own 32-hex-digit id.
    map $http_x_request_id $req_id {
        default                     $request_id;
        "~^[A-Za-z0-9-]{8,64}$"     $http_x_request_id;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/problem+json text/css application/javascript image/svg+xml;

    # The per-address zones are in conf.d/default.conf, whose rates are set by environment variables.
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:20m max_size=200m inactive=10m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
