# Only the NGINX edge reaches the gateway. Egress: the services it routes to, Redis, Keycloak (signing keys).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: edge } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } }   # Prometheus
      ports: [ { port: 8080 } ]
  egress:
    - to: [ { podSelector: { matchLabels: { app.kubernetes.io/part-of: e-commerce } } } ]
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
