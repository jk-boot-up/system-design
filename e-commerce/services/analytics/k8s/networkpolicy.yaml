# Callers: Grafana and Prometheus (platform namespace). Egress: Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
  egress:
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
