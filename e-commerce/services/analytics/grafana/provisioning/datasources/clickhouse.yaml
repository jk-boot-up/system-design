apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: 9000
      protocol: native
      defaultDatabase: analytics
      username: grafana
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
