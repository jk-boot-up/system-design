# Callers: the gateway (public cart API) and order-service (checkout snapshot). Egress: catalog-service, Redis, Kafka, Keycloak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-service
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } }
      ports: [ { port: 8083 } ]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: catalog-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: redis-cart } }
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
