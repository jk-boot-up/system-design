apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: cart-service
      app.kubernetes.io/part-of: e-commerce
    includeSelectors: true
resources: [deployment.yaml, service.yaml, hpa.yaml, pdb.yaml, networkpolicy.yaml]
configMapGenerator:
  - name: cart-service
    literals:
      - REDIS_URL=redis://redis-cart:6379
      - KAFKA_BOOTSTRAP=kafka-bootstrap:9092
      - CATALOG_URL=http://catalog-service
      - JWT_ISSUER=https://id.shop.example/realms/shop
