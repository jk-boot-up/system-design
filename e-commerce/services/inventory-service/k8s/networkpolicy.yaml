# Only order-service may call inventory; inventory may reach only its database, Kafka and the OTel collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-service
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } }
      ports: [ { port: 8084 } ]
  egress:
    - to: [ { podSelector: { matchLabels: { app.kubernetes.io/name: pgbouncer-inventory } } } ]
      ports: [ { port: 5432 } ]
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
