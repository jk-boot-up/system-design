apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: inventory-service
      app.kubernetes.io/part-of: e-commerce
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: inventory-service
    literals:
      - DB_URL=jdbc:postgresql://pgbouncer-inventory:5432/inventory
      - KAFKA_BOOTSTRAP=kafka-bootstrap:9092
      - DB_POOL_SIZE=20
