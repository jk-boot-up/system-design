# Router and worker scale differently (the router is bounded by Kafka partitions, the worker by SMTP throughput), so they
# run as two deployments of the same image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-router
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/component: router } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: router }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8088" }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: e-commerce/notification-service:0.1.0
          env: [ { name: ROLE, value: router } ]
          envFrom: [ { configMapRef: { name: notification-service } }, { secretRef: { name: notification-service } } ]
          ports: [ { name: http, containerPort: 8088 } ]
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { memory: 128Mi } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/component: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8088" }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: e-commerce/notification-service:0.1.0
          env: [ { name: ROLE, value: worker } ]
          envFrom: [ { configMapRef: { name: notification-service } }, { secretRef: { name: notification-service } } ]
          ports: [ { name: http, containerPort: 8088 } ]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 128Mi } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
