# No inbound traffic except Prometheus. Egress: Kafka, RabbitMQ, Redis (platform namespace) and the SMTP relay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
      ports: [ { port: 8088 } ]
  egress:
    - to: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: e-commerce-platform } } } ]
    - ports: [ { port: 587 }, { port: 1025 } ]
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
