apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: order-service
      app.kubernetes.io/part-of: e-commerce
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: order-service
    literals:
      - DB_URL=jdbc:postgresql://pgbouncer-orders:5432/orders
      - KAFKA_BOOTSTRAP=kafka-bootstrap:9092
      - DB_POOL_SIZE=30
      - CART_URL=http://cart-service
      - INVENTORY_URL=http://inventory-service
      - PAYMENT_URL=http://payment-service
      - JWT_ISSUER=https://id.shop.example/realms/shop
