spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: zstd
      properties:
        enable.idempotence: true
        linger.ms: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/shop}
server:
  port: ${PORT:8085}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
clients:
  connect-timeout: 200ms
  read-timeout: 800ms
  cart:
    url: ${CART_URL:http://localhost:8083}
  inventory:
    url: ${INVENTORY_URL:http://localhost:8084}
  payment:
    url: ${PAYMENT_URL:http://localhost:8086}
    read-timeout: 2s
order:
  saga:
    stale-after: 30s
    recovery-interval: 15s
  outbox:
    poll-interval: 100ms
    batch-size: 500
