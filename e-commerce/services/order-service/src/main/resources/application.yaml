spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: zstd
      properties:
        enable.idempotence: true
        linger.ms: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/shop}
server:
  port: ${PORT:8085}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
clients:
  connect-timeout: 200ms
  read-timeout: 800ms
  cart:
    url: ${CART_URL:http://localhost:8083}
  inventory:
    url: ${INVENTORY_URL:http://localhost:8084}
  payment:
    url: ${PAYMENT_URL:http://localhost:8086}
    read-timeout: 2s
order:
  saga:
    stale-after: 30s
    recovery-interval: 15s
  outbox:
    poll-interval: 100ms
    batch-size: 500

# Observability (SPEC 8.2). Spans are exported when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (compose,
# Kubernetes); logs are JSON with traceId and spanId when LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs. Every request is sampled here:
# the collector keeps errors, slow requests and a share of the rest (tail sampling).
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
# Metrics are scraped by Prometheus (/actuator/prometheus); the OpenTelemetry starter would also push them over OTLP.
management.otlp.metrics.export.enabled: false
# Trace context in Kafka headers: producer spans, and consumer spans that continue the producer's trace.
spring.kafka.template.observation-enabled: true
spring.kafka.listener.observation-enabled: true
# Latency histograms for p95/p99 panels, bounded to keep the series count down.
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.minimum-expected-value.http.server.requests: 5ms
management.metrics.distribution.maximum-expected-value.http.server.requests: 5s

# This service's identity for calls to other services: the client-credentials grant against the realm (realm client of
# the same name). The secret comes from the environment (compose: .env defaults; Kubernetes: the service's secret).
service-auth:
  token-uri: ${SERVICE_AUTH_TOKEN_URI:${JWT_ISSUER:http://localhost:8180/realms/shop}/protocol/openid-connect/token}
  client-id: ${SERVICE_AUTH_CLIENT_ID:${spring.application.name}}
  client-secret: ${SERVICE_AUTH_CLIENT_SECRET:}
