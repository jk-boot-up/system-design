spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: zstd
      properties:
        enable.idempotence: true
        linger.ms: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/shop}
server:
  port: ${PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      service: catalog-service
catalog:
  cache:
    ttl: 10m
  outbox:
    poll-interval: 100ms
    batch-size: 500
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}       # where browsers upload, when it differs from the endpoint above
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:product-images}
  images:
    public-base-url: ${IMAGE_BASE_URL:http://localhost:9000/product-images}

# Observability (SPEC 8.2). Spans are exported when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (compose,
# Kubernetes); logs are JSON with traceId and spanId when LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs. Every request is sampled here:
# the collector keeps errors, slow requests and a share of the rest (tail sampling).
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
# Metrics are scraped by Prometheus (/actuator/prometheus); the OpenTelemetry starter would also push them over OTLP.
management.otlp.metrics.export.enabled: false
# Trace context in Kafka headers: producer spans, and consumer spans that continue the producer's trace.
spring.kafka.template.observation-enabled: true
spring.kafka.listener.observation-enabled: true
# Latency histograms for p95/p99 panels, bounded to keep the series count down.
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.minimum-expected-value.http.server.requests: 5ms
management.metrics.distribution.maximum-expected-value.http.server.requests: 5s
