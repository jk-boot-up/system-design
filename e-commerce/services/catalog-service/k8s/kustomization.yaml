apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: catalog-service
      app.kubernetes.io/part-of: e-commerce
    includeSelectors: true
resources: [deployment.yaml, service.yaml, hpa.yaml, pdb.yaml, networkpolicy.yaml]
configMapGenerator:
  - name: catalog-service
    literals:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.monitoring:4318/v1/traces
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
      - DB_URL=jdbc:postgresql://catalog-db-rw:5432/catalog
      - REDIS_URL=redis://redis-cache:6379
      - KAFKA_BOOTSTRAP=kafka-bootstrap:9092
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=product-images
      - IMAGE_BASE_URL=https://cdn.shop.example/product-images
      - JWT_ISSUER=https://id.shop.example/realms/shop
# DB_USER, DB_PASSWORD, S3_ACCESS_KEY and S3_SECRET_KEY come from the catalog-service secret (see deploy/k8s overlays).
