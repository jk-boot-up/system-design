name: e-commerce / end-to-end

# Every journey (API and storefront in a browser) against the whole compose stack, then a ZAP baseline scan and
# Lighthouse budgets: nightly, on demand, and when the tests change.
on:
  schedule: [ { cron: '30 2 * * *' } ]
  workflow_dispatch:
  push:
    paths: ['e-commerce/tests/e2e/**', 'e-commerce/web/storefront/**', '.github/workflows/e-commerce-e2e.yml']

defaults:
  run:
    working-directory: e-commerce/tests/e2e

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: e-commerce/tests/e2e/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Browser for the storefront journeys
        run: npx playwright install --with-deps chromium
      - name: Journeys, core stack and every profile
        run: ./run-compose.sh core search reviews async analytics
      - name: OWASP ZAP baseline scan of the storefront (passive; fails on any high-risk alert)
        working-directory: e-commerce/deploy/compose
        run: |
          docker compose up -d --wait
          docker run --rm --network host -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost:8443/ -I -r zap-report.html -z "-config connection.sslAcceptAll=true"
      - name: Lighthouse budgets (home and search, mobile)
        working-directory: e-commerce/web/storefront
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.json
      - name: Stack logs
        if: failure()
        working-directory: e-commerce/deploy/compose
        run: docker compose --profile all logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e-commerce/tests/e2e/playwright-report
            e-commerce/tests/e2e/test-results
            e-commerce/deploy/compose/compose.log
            e-commerce/deploy/compose/zap-report.html
