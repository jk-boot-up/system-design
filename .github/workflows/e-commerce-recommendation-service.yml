name: e-commerce / recommendation-service

on:
  push:
    paths: ['e-commerce/services/recommendation-service/**', '.github/workflows/e-commerce-recommendation-service.yml']
  pull_request:
    paths: ['e-commerce/services/recommendation-service/**', '.github/workflows/e-commerce-recommendation-service.yml']

defaults:
  run:
    working-directory: e-commerce/services/recommendation-service

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14', cache: pip, cache-dependency-path: e-commerce/services/recommendation-service/pyproject.toml }
      - run: pip install -e '.[test]'
      - name: Lint
        run: ruff check src tests
      - name: Unit, API and architecture tests
        run: pytest
      - name: Container tests (Redis, Kafka)
        run: pytest -m containers
      - name: Container image
        run: docker build -t e-commerce/recommendation-service:${{ github.sha }} .
