name: e-commerce / review-service

on:
  push:
    paths: ['e-commerce/services/review-service/**', '.github/workflows/e-commerce-review-service.yml', '.github/workflows/e-commerce-image.yml']
  pull_request:
    paths: ['e-commerce/services/review-service/**', '.github/workflows/e-commerce-review-service.yml', '.github/workflows/e-commerce-image.yml']

defaults:
  run:
    working-directory: e-commerce/services/review-service

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, architecture and container tests (Cassandra, Kafka)
        run: ./gradlew build -PwithContainers
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: review-service-test-reports, path: e-commerce/services/review-service/build/reports }

  image:
    needs: build
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/e-commerce-image.yml
    with: { name: review-service, context: e-commerce/services/review-service }
